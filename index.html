<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071022">
<title>Barcelona · Phrases utiles</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <span class="badge">⚽ Visca el Barça</span>
  <h1>Barcelona 🇪🇸</h1>
  <p>Español → Français · touche 🔊 pour écouter la prononciation</p>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
    <input id="search" type="search" placeholder="Rechercher une phrase ou un mot…" aria-label="Rechercher une phrase" autocomplete="off">
    <button id="clear" type="button" aria-label="Effacer la recherche">×</button>
  </div>
  <nav class="chips" id="chips" aria-label="Thèmes de phrases"></nav>
</div>

<main>
  <section class="translator">
    <h2>🎤 Traducteur vocal</h2>
    <div class="t-card">
      <div class="t-langs">
        <select id="srcLang" aria-label="Langue source"></select>
        <button id="swapLangs" type="button" class="btn" aria-label="Inverser les langues">⇄</button>
        <select id="dstLang" aria-label="Langue cible"></select>
      </div>
      <button id="recBtn" type="button" class="rec-btn">🎤 Appuyer pour parler</button>
      <p class="t-status" id="recStatus"></p>
      <audio id="playback" controls hidden></audio>
      <div class="t-result" id="tResult" hidden>
        <div class="t-row">
          <p class="t-heard" id="heardText"></p>
          <button class="btn say" id="sayHeard" aria-label="Écouter la phrase entendue"></button>
        </div>
        <div class="t-row">
          <p class="t-translated" id="translatedText"></p>
          <button class="btn say" id="sayTranslated" aria-label="Écouter la traduction"></button>
        </div>
      </div>
      <div class="t-manual">
        <input id="manualText" type="text" placeholder="…ou tapez une phrase à traduire" autocomplete="off">
        <button id="translateBtn" type="button">Traduire</button>
      </div>
      <p class="t-note" id="tNote"></p>
    </div>
  </section>

  <p class="count" id="count"></p>
  <div id="content"></div>
</main>

<footer>
  Astuce : les Espagnols apprécient qu'on commence par « Hola » et « Por favor ». 😊
  <br><span class="sos">🚨 Urgences en Espagne : 112</span>
</footer>

<script src="script.js"></script>
</body>
</html>
