<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050d1f">
<meta name="description" content="Phrases utiles en espagnol (catalan) pour votre voyage à Barcelone avec traduction et prononciation vocale.">
<title>Barcelona · Phrases essentielles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <span class="badge"><span class="dot" aria-hidden="true"></span>Visca el Barça</span>
  <h1>Barcelona <span class="flag" aria-hidden="true">🇪🇸</span></h1>
  <p class="lede">Español → Français · appuyez sur le haut-parleur 🔊 pour écouter la prononciation</p>
  <div class="hero-stats" aria-hidden="true">
    <span><strong id="statPhrases">0</strong> phrases</span>
    <span><strong id="statThemes">0</strong> thèmes</span>
    <span><strong id="statLangs">3</strong> langues</span>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
    <input id="search" type="search" placeholder="Rechercher une phrase ou un mot…" aria-label="Rechercher une phrase" autocomplete="off">
    <button id="clear" type="button" aria-label="Effacer la recherche">×</button>
  </div>
  <nav class="chips" id="chips" aria-label="Thèmes de phrases"></nav>
</div>

<main>
  <section class="translator">
    <details class="acc" id="translatorAcc">
      <summary aria-label="Ouvrir ou fermer le traducteur vocal">
        <h2>🎤 Traducteur vocal</h2>
        <span class="acc-icon" aria-hidden="true"></span>
      </summary>
      <div class="t-card">
      <div class="t-langs">
        <select id="srcLang" aria-label="Langue source"></select>
        <button id="swapLangs" type="button" class="btn" aria-label="Inverser les langues">⇄</button>
        <select id="dstLang" aria-label="Langue cible"></select>
      </div>
      <button id="histBtn" type="button" class="hist-btn">🕘 Historique des traductions <span class="h-count" id="histCount" hidden>0</span></button>
      <div class="t-history" id="tHistory" hidden>
        <div class="h-list" id="histList"></div>
        <div class="h-actions">
          <button id="histClear" type="button" class="hist-clear" hidden>Tout supprimer</button>
          <button id="cacheClear" type="button" class="hist-clear">Vider le cache</button>
        </div>
      </div>
      <form class="t-form" id="translateForm" novalidate>
        <label class="t-label" for="manualText">Ou écrivez votre phrase ✍️</label>
        <textarea id="manualText" name="phrase" rows="4" placeholder="Tapez votre phrase à traduire…" autocomplete="off"></textarea>
        <div class="t-field-foot">
          <span class="t-char" id="charCount" aria-live="polite">0</span>
          <button type="submit" class="t-submit"><span>Traduire la phrase</span></button>
        </div>
      </form>
      <p class="t-note" id="tNote"></p>
      </div>
    </details>
  </section>

  <p class="count" id="count" role="status" aria-live="polite"></p>
  <div id="content"></div>
</main>

<footer>
  <p class="tip">Astuce : les Espagnols apprécient qu'on commence par « Hola » et « Por favor ». 😊</p>
  <span class="sos"><span class="pulse" aria-hidden="true"></span>Urgences en Espagne : <strong>112</strong></span>
</footer>

<script src="script.js"></script>
</body>
</html>
